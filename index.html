<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phison Terminal | Premium 4H Suite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-gold: #f0b90b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1e293b;
            --buy-color: #10b981;
            --sell-color: #ef4444;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 1.4rem;
            color: var(--accent-gold);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        select {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .buy { background: rgba(16, 185, 129, 0.15); color: var(--buy-color); border: 1px solid rgba(16, 185, 129, 0.3); }
        .sell { background: rgba(239, 68, 68, 0.15); color: var(--sell-color); border: 1px solid rgba(239, 68, 68, 0.3); }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: var(--buy-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--buy-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ PHISON TERMINAL <span style="font-size:0.6rem; color:var(--text-muted); font-weight:normal;"><span class="live-dot"></span> LIVE 4H SUITE</span></h1>
        <select id="assetSelect" onchange="changeAsset()">
            <option value="OANDA:XAUUSD">Gold (XAUUSD)</option>
            <option value="FX:EURUSD">EUR/USD</option>
            <option value="FX:GBPUSD">GBP/USD</option>
            <option value="FX:USDJPY">USD/JPY</option>
            <option value="CRYPTO:BTCUSD">Bitcoin (BTCUSD)</option>
            <option value="FX:USDCHF">USD/CHF</option>
            <option value="FX:USDCAD">USD/CAD</option>
            <option value="FX:GBPJPY">GBP/JPY</option>
        </select>
    </div>

    <!-- Live TradingView Chart -->
    <div class="card">
        <h2>
            <span>📈 Interactive Chart</span>
            <span id="currentAssetLabel" style="font-size: 0.85rem; color: var(--accent-gold);">OANDA:XAUUSD (4H)</span>
        </h2>
        <div class="tradingview-widget-container" style="height:420px; width:100%;">
          <div id="tradingview_chart" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          let tvWidget;
          function initChart(symbol) {
              document.getElementById('tradingview_chart').innerHTML = "";
              tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "240",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#131b2e",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart"
              });
          }
          initChart("OANDA:XAUUSD");

          function changeAsset() {
              const selected = document.getElementById('assetSelect').value;
              document.getElementById('currentAssetLabel').innerText = selected + " (4H)";
              initChart(selected);
          }
          </script>
        </div>
    </div>

    <!-- Active Signals Matrix -->
    <div class="card">
        <h2>🚨 Live Strategy Scanner Feed</h2>
        <table>
            <tr><th>Asset</th><th>Strategy</th><th>Action</th></tr>
            <tr>
                <td><strong>XAUUSD</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">Support Retest Active</span></td>
                <td style="font-size:0.8rem;">Trend Continuation (EMA)</td>
                <td><span class="badge buy">BUY</span></td>
            </tr>
            <tr>
                <td><strong>BTCUSD</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">Structure Shift Cross</span></td>
                <td style="font-size:0.8rem;">Phison 20 MA</td>
                <td><span class="badge buy">BUY</span></td>
            </tr>
            <tr>
                <td><strong>EURUSD</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">Resistance Rejection</span></td>
                <td style="font-size:0.8rem;">Trend Continuation (EMA)</td>
                <td><span class="badge sell">SELL</span></td>
            </tr>
        </table>
    </div>

</body>
</html>
